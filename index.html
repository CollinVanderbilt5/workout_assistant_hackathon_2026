<!DOCTYPE html>
<html>
  <body>
    <div id="root"></div>
	<script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18",
          "react-dom/client": "https://esm.sh/react-dom@18/client",
          "react-body-highlighter": "https://esm.sh/react-body-highlighter@2.0.5?external=react,react-dom"
        }
      }
    </script>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
	  import Model from "react-body-highlighter";

	  const data = [
        { name: "Bench Press", muscles: ["chest", "triceps", "front-deltoids"] },
        { name: "Squat", muscles: ["quadriceps", "gluteal"] },
      ];

      createRoot(document.getElementById("root")).render(
        React.createElement(Model, {data, type: "posterior", style: { width: "20rem", padding: "2rem" }})
      );
    </script>
  </body>
</html>
